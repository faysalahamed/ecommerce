version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: ecommerce-app:latest
    container_name: nextjs_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://daraz_user:change_me_in_prod@postgres:5432/daraz?schema=public
      - NODE_ENV=production
      - JWT_SECRET=daraz-clone-dev-secret-change-in-production-2024-a8f3c2e9b1d4
      - SMS_PROVIDER=demo
    depends_on:
      - postgres

volumes:
  postgres_data:
